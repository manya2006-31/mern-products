<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Management</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Product Management</h1>
      <p>CRUD Operations on Array of Items</p>
    </header>

    <div id="message" class="message hidden"></div>

    <section class="card">
      <h2 id="form-title">Add New Product</h2>
      <form id="product-form">
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="e.g. Book" />

        <label for="price">Price</label>
        <input type="number" id="price" placeholder="e.g. 250" min="0" />

        <div class="actions">
          <button type="submit" id="submit-btn" class="btn btn-primary">Submit</button>
          <button type="button" id="cancel-btn" class="btn btn-secondary hidden">Cancel</button>
        </div>
      </form>
    </section>

    <section class="card">
      <h2>Product List</h2>
      <table>
        <thead>
          <tr><th>ID</th><th>NAME</th><th>PRICE</th><th>ACTION</th></tr>
        </thead>
        <tbody id="product-body"></tbody>
      </table>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
